<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B28 Entertainment | Stream Movies & Series</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08090d;
      --bg-soft: #101319;
      --panel: rgba(18, 21, 28, 0.95);
      --panel-2: rgba(24, 28, 36, 0.92);
      --card: rgba(22, 26, 34, 0.92);
      --text: #f3f4f6;
      --muted: #aab0bb;
      --subtle: #7c8595;
      --border: rgba(255,255,255,0.08);
      --accent: #e50914;
      --accent-2: #ff1b3d;
      --shadow: 0 22px 50px rgba(0,0,0,0.45);
      --radius: 18px;
      --transition: all 0.22s ease;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', Arial, sans-serif;
      line-height: 1.45;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0d1016; }
    ::-webkit-scrollbar-thumb {
      background: rgba(229, 9, 20, 0.55);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 2.2%;
      background: rgba(8, 9, 13, 0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 900;
      letter-spacing: -0.08em;
      text-transform: uppercase;
      font-size: 1.25rem;
      white-space: nowrap;
    }

    .brand .accent { color: var(--accent); }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      overflow-x: auto;
      padding-bottom: 2px;
      min-width: 200px;
    }

    .main-nav::-webkit-scrollbar { height: 4px; }

    .nav-btn {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      padding: 0.52rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 600;
      font-size: 0.82rem;
    }

    .nav-btn.active,
    .nav-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 0 18px rgba(229, 9, 20, 0.35);
    }

    .sync-pill {
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(229, 9, 20, 0.12);
      color: #ffd9dc;
      border-radius: 999px;
      padding: 0.42rem 0.8rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .search-wrap {
      position: relative;
      width: min(300px, 30vw);
      min-width: 180px;
      flex-shrink: 0;
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      fill: var(--muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: white;
      border-radius: 999px;
      padding: 0.72rem 1rem 0.72rem 2.7rem;
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: rgba(229, 9, 20, 0.6);
      box-shadow: 0 0 0 4px rgba(229,9,20,0.12);
    }
    .search-input::placeholder { color: var(--subtle); }

    main { padding-bottom: 40px; }

    .hero {
      position: relative;
      min-height: 620px;
      padding: 0 4% 4rem;
      display: flex;
      align-items: flex-end;
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      transition: background-image 0.6s ease;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(8,9,13,0.92) 0%, rgba(8,9,13,0.65) 28%, rgba(8,9,13,0.24) 56%, rgba(8,9,13,0.7) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 660px;
    }

    .badge {
      display: inline-block;
      margin-bottom: 14px;
      background: var(--accent);
      color: white;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      box-shadow: 0 0 18px rgba(229,9,20,0.4);
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 4vw, 4rem);
      line-height: 1.02;
      letter-spacing: -0.06em;
      font-weight: 900;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .hero-meta strong {
      color: var(--accent);
      font-weight: 700;
    }

    .hero-desc {
      color: #dfe3eb;
      max-width: 560px;
      font-size: 0.96rem;
      margin-bottom: 26px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0.9rem 1.5rem;
      border-radius: 999px;
      font-weight: 700;
      transition: var(--transition);
    }

    .btn.primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 12px 28px rgba(229, 9, 20, 0.38);
    }

    .btn.primary:hover { transform: translateY(-2px); background: #ff1b3d; }

    .btn.secondary {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .btn.secondary:hover { background: rgba(255,255,255,0.15); }

    .content-shell {
      padding: 2rem 2.2% 4rem;
    }

    .row {
      margin-bottom: 2.2rem;
    }

    .row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .row-title {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      margin: 0;
    }

    .row-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 22px;
      background: var(--accent);
      border-radius: 99px;
      box-shadow: 0 0 10px rgba(229,9,20,0.5);
    }

    .explore {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
    }
    .explore:hover { color: white; }

    .card-row {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-behavior: smooth;
    }

    .movie-card {
      width: 220px;
      min-width: 220px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition);
    }

    .movie-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow);
      border-color: rgba(229,9,20,0.45);
    }

    .poster {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #0b0d12;
      overflow: hidden;
    }

    .poster img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .movie-card:hover .poster img { transform: scale(1.06); }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.22);
      opacity: 0;
      transition: var(--transition);
    }

    .movie-card:hover .play-overlay { opacity: 1; }

    .play-badge {
      width: 54px; height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(229,9,20,0.35);
      transition: transform 0.2s;
    }
    .play-badge:hover { transform: scale(1.08); }

    .card-body {
      padding: 0.9rem 0.85rem 0.95rem;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 0.5rem;
      color: var(--muted);
      font-size: 0.69rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .card-top .rating {
      color: #ffd166;
      letter-spacing: 0.02em;
    }

    .card-title {
      margin: 0;
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1.4;
      min-height: 2.55em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.8rem;
      font-size: 0.74rem;
      color: var(--muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0.84);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-panel {
      width: min(1100px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      flex-shrink: 0;
    }

    .modal-header .title {
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      transition: var(--transition);
    }

    .close-btn:hover { color: var(--accent); transform: rotate(90deg); }

    .modal-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      flex: 1;
      overflow: hidden;
    }

    .player-wrap {
      position: relative;
      width: 100%;
      background: #000;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    .player-wrap iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    .player-wrap #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .video-info {
      padding: 1.2rem;
    }

    .video-info h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
      line-height: 1.4;
    }

    .video-info p {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .side-panel {
      border-left: 1px solid var(--border);
      padding: 1rem 0.9rem;
      background: rgba(255,255,255,0.01);
      display: flex;
      flex-direction: column;
      min-height: 300px;
    }

    .side-panel h3 {
      margin: 0 0 0.8rem;
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .related-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow-y: auto;
      flex: 1;
    }

    .related-item {
      display: flex;
      gap: 0.7rem;
      align-items: center;
      background: rgba(255,255,255,0.02);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0.45rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .related-item:hover {
      border-color: rgba(229,9,20,0.35);
      background: rgba(255,255,255,0.05);
    }

    .related-item img {
      width: 110px;
      min-width: 110px;
      height: 68px;
      border-radius: 8px;
      object-fit: cover;
    }

    .related-item .meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .related-item .title {
      font-size: 0.78rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      color: var(--muted);
    }

    .error-msg {
      color: var(--accent);
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 900px) {
      .modal-body { grid-template-columns: 1fr; }
      .side-panel {
        border-left: none;
        border-top: 1px solid var(--border);
        min-height: 200px;
        max-height: 250px;
      }
      .search-wrap { width: 180px; min-width: 140px; }
      .topbar { gap: 10px; }
    }

    @media (max-width: 680px) {
      .topbar { gap: 8px; padding-inline: 14px; }
      .brand { font-size: 0.94rem; }
      .search-wrap { width: 140px; min-width: 100px; }
      .search-input { font-size: 0.8rem; padding: 0.5rem 0.8rem 0.5rem 2.2rem; }
      .search-wrap svg { left: 10px; width: 14px; height: 14px; }
      .hero { padding-inline: 18px; min-height: 400px; }
      .content-shell { padding-inline: 16px; }
      .movie-card { width: 160px; min-width: 160px; }
      .row-title { font-size: 1.18rem; }
      .nav-btn { font-size: 0.7rem; padding: 0.4rem 0.7rem; }
      .modal { padding: 12px; }
      .related-item img { width: 80px; min-width: 80px; height: 50px; }
    }

    @media (max-width: 480px) {
      .movie-card { width: 140px; min-width: 140px; }
      .hero h1 { font-size: 1.8rem; }
      .btn { padding: 0.6rem 1rem; font-size: 0.85rem; }
    }
  </style>
</head>

    </section>

    <section class="content-shell">
      <div id="contentRoot"></div>
    </section>
  </main>

  <div id="videoModal" class="modal" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-header">
        <div class="title">B28 Streaming Player</div>
        <button class="close-btn" id="closeModalBtn" aria-label="Close player">&times;</button>
      </div>
      <div class="modal-body">
        <div>
          <div class="player-wrap">
            <div id="player"></div>
          </div>
          <div class="video-info">
            <h2 id="modalTitle">Video Title</h2>
            <p id="modalDesc">Video Description</p>
          </div>
        </div>

        <aside class="side-panel">
          <h3>More from B28</h3>
          <div id="relatedList" class="related-list"></div>
        </aside>
      </div>
    </div>
  </div>

      { id: 'JpKsOGtn5J0', title: 'Kiza Official Film | Kenyan Film | Struggles of being a youth', thumbnail: 'https://i.ytimg.com/vi/JpKsOGtn5J0/hqdefault.jpg', date: '2024-03-20', genre: 'Action', desc: 'A compelling drama about the challenges faced by young people in contemporary Kenya.', rating: '8.3', sourceType: 'youtube', videoId: 'JpKsOGtn5J0' },
      { id: 'f8vQh65dEWU', title: 'Kiza Official Trailer | Kenyan Film', thumbnail: 'https://i.ytimg.com/vi/f8vQh65dEWU/hqdefault.jpg', date: '2024-03-10', genre: 'Thriller', desc: 'Official trailer for Kiza - An emotionally powerful Kenyan film about youth and resilience.', rating: '8.0', sourceType: 'youtube', videoId: 'f8vQh65dEWU' },
      { id: 'sSmx-umq-lU', title: 'FRAGILE HEARTS - OFFICIAL KENYAN FILM Latest 2024 Movie', thumbnail: 'https://i.ytimg.com/vi/sSmx-umq-lU/hqdefault.jpg', date: '2024-02-15', genre: 'Horror', desc: 'A tender drama exploring the delicate nature of human emotions and relationships.', rating: '8.7', sourceType: 'youtube', videoId: 'sSmx-umq-lU' },
      { id: '6ZfqpV1ZPtQ', title: 'FRAGILE HEARTS OFFICIAL TRAILER - KENYAN FILM', thumbnail: 'https://i.ytimg.com/vi/6ZfqpV1ZPtQ/hqdefault.jpg', date: '2024-02-01', genre: 'Horror', desc: 'Official trailer for Fragile Hearts - A beautiful Kenyan drama about love and vulnerability.', rating: '7.8', sourceType: 'youtube', videoId: '6ZfqpV1ZPtQ' }
    ];

    const SOURCE_CONFIG = {
      localUrl: './b28-catalog.json',
      remoteUrls: [],
      refreshMs: 120000
    };

    // ============================================================
    // STATE
    // ============================================================
    const state = {
      videos: [...DEFAULT_CATALOG],
      currentGenre: 'All',
      search: '',
      sourceLabel: 'local catalog',
      currentVideo: null,
      isPlayerReady: false
    };

    // ============================================================
    // DOM REFS
    // ============================================================
    const contentRoot = document.getElementById('contentRoot');
    const heroSection = document.getElementById('heroSection');
    const heroTitle = document.getElementById('heroTitle');
    const heroDate = document.getElementById('heroDate');
    const heroDesc = document.getElementById('heroDesc');
    const watchNowBtn = document.getElementById('watchNowBtn');
    const myListBtn = document.getElementById('myListBtn');
    const searchInput = document.getElementById('searchInput');
    const navButtons = [...document.querySelectorAll('.nav-btn')];
    const modal = document.getElementById('videoModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const relatedList = document.getElementById('relatedList');
    const syncStatus = document.getElementById('syncStatus');
    let playerContainer = document.getElementById('player');
    let youtubePlayer = null;
    let youTubeApiLoaded = false;
    let apiLoadPromise = null;
    let catalogInitialized = false;

    const GENRE_ROW_MAP = {
      'Drama': 'Drama',
      'Action': 'Action',
      'Thriller': 'Thriller',
      'Horror': 'Horror',
      'Trending B28 Originals': 'Popular',
      'Popular on B28': 'Popular'
    };

    function escapeHtml(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(text) {
      return escapeHtml(text).replace(/'/g, '&#39;');
    }

    function catalogFingerprint(videos) {
      return videos.map((v) => v.id).join('|');
    }

    // ============================================================
    // YOUTUBE PLAYER MANAGEMENT (FIXED)
    // ============================================================
    
    // Load YouTube IFrame API with proper promise handling
    function loadYouTubeApi() {
      // If already loaded, resolve immediately
      if (typeof YT !== 'undefined' && typeof YT.Player !== 'undefined') {
        youTubeApiLoaded = true;
        return Promise.resolve();
      }

      // If API is already loading, return the existing promise
      if (apiLoadPromise) {
        return apiLoadPromise;
      }

      // If the script tag already exists, wait for it
      if (document.getElementById('youtube-iframe-api')) {
        apiLoadPromise = new Promise((resolve) => {
          const checkReady = () => {
            if (typeof YT !== 'undefined' && typeof YT.Player !== 'undefined') {
              youTubeApiLoaded = true;
              resolve();
            } else {
              setTimeout(checkReady, 100);
            }
          };
          checkReady();
        });
        return apiLoadPromise;
      }

      // Create and load the API script
      apiLoadPromise = new Promise((resolve, reject) => {
        const tag = document.createElement('script');
        tag.id = 'youtube-iframe-api';
        tag.src = 'https://www.youtube.com/iframe_api';
        tag.async = true;

        // Set up the global callback
        window.onYouTubeIframeAPIReady = () => {
          youTubeApiLoaded = true;
          resolve();
        };

        tag.onerror = () => {
          reject(new Error('Failed to load YouTube API'));
        };

        document.head.appendChild(tag);

        // Timeout fallback
        setTimeout(() => {
          if (!youTubeApiLoaded) {
            reject(new Error('YouTube API load timeout'));
          }
        }, 15000);
      });

      return apiLoadPromise;
    }

    // Create a YouTube player instance
    function createYouTubePlayer(videoId, autoplay = true) {
      return new Promise((resolve, reject) => {
        if (typeof YT === 'undefined' || typeof YT.Player === 'undefined') {
          reject(new Error('YouTube API not loaded'));
          return;
        }

        try {
          const player = new YT.Player(playerContainer, {
            height: '100%',
            width: '100%',
            videoId: videoId,
            playerVars: {
              autoplay: autoplay ? 1 : 0,
              playsinline: 1,
              rel: 0,
              modestbranding: 1,
              fs: 1,
              controls: 1,
              disablekb: 0
            },
            events: {
              onReady: () => resolve(player),
              onError: (e) => reject(new Error(`Player error: ${e.data}`))
            }
          });
        } catch (error) {
          reject(error);
        }
      });
    }

    // Destroy the current player
    function destroyYouTubePlayer() {
      if (youtubePlayer && typeof youtubePlayer.destroy === 'function') {
        try {
          youtubePlayer.destroy();
        } catch (e) {
          // Ignore destroy errors
        }
      }
      youtubePlayer = null;
      if (!playerContainer || !playerContainer.parentNode) return;
      const wrap = playerContainer.parentNode;
      playerContainer.remove();
      const fresh = document.createElement('div');
      fresh.id = 'player';
      wrap.appendChild(fresh);
      playerContainer = fresh;
    }

    // ============================================================
    // VIDEO PLAYBACK (FIXED)
    // ============================================================
    async function playVideo(video) {
      if (!video) return;

      const videoId = video.videoId || video.id;
      if (!videoId) {
        console.error('No video ID found for:', video);
        return;
      }

      // Clean up previous player
      destroyYouTubePlayer();

      // Update modal info
      modalTitle.textContent = video.title || 'Untitled';
      modalDesc.textContent = video.desc || 'No description available.';

      // Build related list
      renderRelatedVideos(video);

      // Show modal
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';

      try {
        // Load YouTube API
        await loadYouTubeApi();

        // Create player with autoplay
        youtubePlayer = await createYouTubePlayer(videoId, true);
        state.currentVideo = video;
        state.isPlayerReady = true;

      } catch (error) {
        console.error('Player error:', error);
        // Fallback: use iframe directly
        playerContainer.innerHTML = `
          <iframe
            src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&fs=1&playsinline=1&enablejsapi=1"
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
            allowfullscreen
            frameborder="0"
            style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;"
          ></iframe>
        `;
        state.currentVideo = video;
        state.isPlayerReady = true;
      }
    }

    function renderRelatedVideos(currentVideo) {
      relatedList.innerHTML = '';
      const related = state.videos
        .filter(v => v.id !== currentVideo.id)
        .slice(0, 8);

      if (related.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'loading-spinner';
        empty.textContent = 'No related videos available';
        relatedList.appendChild(empty);
        return;
      }

      related.forEach((video) => {
        const item = document.createElement('div');
        item.className = 'related-item';
        const thumb = video.thumbnail || `https://i.ytimg.com/vi/${video.videoId || video.id}/hqdefault.jpg`;
        item.innerHTML = `
          <img src="${escapeAttr(thumb)}" alt="${escapeAttr(video.title)}" loading="lazy" onerror="this.src='https://via.placeholder.com/110x68/1a1a2e/888?text=No+Image'" />
          <div>
            <div class="title">${escapeHtml(video.title)}</div>
            <div class="meta">${escapeHtml(video.date || '')} • ${escapeHtml(video.genre || '')}</div>
          </div>
        `;
        item.addEventListener('click', () => playVideo(video));
        relatedList.appendChild(item);
      });
    }

    // ============================================================
    // CLOSE PLAYER
    // ============================================================
    function closePlayer() {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      destroyYouTubePlayer();
      state.isPlayerReady = false;
      state.currentVideo = null;
      document.body.style.overflow = '';
    }

    // ============================================================
    // CATALOG MANAGEMENT
    // ============================================================
    function setSyncStatus(text, isError = false) {
      syncStatus.textContent = text;
      syncStatus.style.color = isError ? '#ff6b6b' : '#ffd9dc';
    }

    function normalizeMovie(item, fallbackIndex = 0) {
      const id = item.id || item.slug || item.videoId || `movie-${fallbackIndex}`;
      const title = item.title || item.name || 'Untitled movie';
      const genre = item.genre || item.category || 'Drama';
      const desc = item.description || item.desc || item.summary || 'No description available.';
      const date = item.date || item.year || item.release_date || '2026';
      const rating = item.rating || item.score || (Math.random() * 2 + 7).toFixed(1);
      const thumbnail = item.thumbnail || item.poster || item.image || item.cover || `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
      const sourceType = item.sourceType || item.source || item.provider || 'youtube';
      const videoId = item.videoId || item.youtubeId || item.source_id || item.embedId || id;
      return {
        id,
        title,
        genre,
        desc,
        date: String(date).slice(0, 10),
        rating: String(rating),
        thumbnail,
        sourceType,
        videoId
      };
    }

    function normalizeCatalog(raw) {
      if (!raw) return DEFAULT_CATALOG;
      if (Array.isArray(raw)) return raw.map((item, index) => normalizeMovie(item, index));
      if (Array.isArray(raw.movies)) return raw.movies.map((item, index) => normalizeMovie(item, index));
      if (Array.isArray(raw.videos)) return raw.videos.map((item, index) => normalizeMovie(item, index));
      if (Array.isArray(raw.data)) return raw.data.map((item, index) => normalizeMovie(item, index));
      if (Array.isArray(raw.results)) return raw.results.map((item, index) => normalizeMovie(item, index));
      return DEFAULT_CATALOG;
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Request failed: ${response.status}`);
      return response.json();
    }

    function applyCatalogUpdate(videos, sourceLabel, statusText, isError = false) {
      const prevFingerprint = catalogFingerprint(state.videos);
      state.videos = videos;
      state.sourceLabel = sourceLabel;
      setSyncStatus(statusText, isError);

      const changed = prevFingerprint !== catalogFingerprint(state.videos);
      if (!catalogInitialized || changed) {
        if (!state.search) renderCurrentView();
        if (!catalogInitialized && state.videos[0]) setHero(state.videos[0]);
        catalogInitialized = true;
      }
    }

    async function loadCatalog() {
      // If running from file:// protocol, skip fetch (browsers block it for local files)
      if (window.location.protocol === 'file:') {
        applyCatalogUpdate([...DEFAULT_CATALOG], 'local catalog', 'Local catalog active');
        return true;
      }

      const sources = [SOURCE_CONFIG.localUrl, ...SOURCE_CONFIG.remoteUrls.filter(Boolean)];

      for (const url of sources) {
        try {
          const data = await fetchJson(url);
          const normalized = normalizeCatalog(data);
          if (normalized && normalized.length) {
            applyCatalogUpdate(
              normalized,
              url.includes('http') ? 'remote server' : 'local database',
              `Auto-sync active • ${url.includes('http') ? 'remote server' : 'local database'}`
            );
            return true;
          }
        } catch (error) {
          console.warn('Catalog sync failed for', url, error);
        }
      }

      applyCatalogUpdate([...DEFAULT_CATALOG], 'built-in catalog', 'Built-in catalog active');
      return false;
    }

    // ============================================================
    // RENDER FUNCTIONS
    // ============================================================
    function shuffle(list) {
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getRowsFor(genreFilter) {
      const base = genreFilter && genreFilter !== 'All' && genreFilter !== 'Popular'
        ? state.videos.filter(v => v.genre === genreFilter)
        : state.videos;

      if (genreFilter === 'Popular') {
        const items = shuffle(base).slice(0, 12);
        if (items.length === 0) return [];
        return [{ title: 'Popular on B28', items }];
      }

      if (genreFilter && genreFilter !== 'All') {
        const items = shuffle(base).slice(0, 10);
        if (items.length === 0) return [];
        return [{ title: genreFilter, items }];
      }

      const rows = [
        { title: 'Trending B28 Originals', items: shuffle(state.videos).slice(0, 12) },
        { title: 'Drama', items: shuffle(state.videos.filter(v => v.genre === 'Drama')).slice(0, 10) },
        { title: 'Action', items: shuffle(state.videos.filter(v => v.genre === 'Action')).slice(0, 10) },
        { title: 'Thriller', items: shuffle(state.videos.filter(v => v.genre === 'Thriller')).slice(0, 10) },
        { title: 'Horror', items: shuffle(state.videos.filter(v => v.genre === 'Horror')).slice(0, 10) }
      ];

      return rows.filter(r => r.items.length > 0);
    }

    function createCard(video) {
      const card = document.createElement('article');
      card.className = 'movie-card';
      const thumbnail = video.thumbnail || `https://i.ytimg.com/vi/${video.videoId || video.id}/hqdefault.jpg`;
      card.innerHTML = `
        <div class="poster">
          <img src="${escapeAttr(thumbnail)}" alt="${escapeAttr(video.title)}" loading="lazy" onerror="this.src='https://via.placeholder.com/220x330/1a1a2e/888?text=No+Image'" />
          <div class="play-overlay">
            <div class="play-badge">
              <svg width="22" height="22" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="card-top">
            <span>${escapeHtml(video.genre || 'Film')}</span>
            <span class="rating">★ ${escapeHtml(video.rating || 'N/A')}</span>
          </div>
          <h3 class="card-title">${escapeHtml(video.title)}</h3>
          <div class="card-bottom">
            <span>${escapeHtml(String(video.date).slice(0, 4) || '2026')}</span>
            <span>${escapeHtml(video.sourceType || 'B28')}</span>
          </div>
        </div>
      `;
      card.addEventListener('click', () => playVideo(video));
      return card;
    }

    function renderRows(rows) {
      contentRoot.innerHTML = '';

      if (!rows || rows.length === 0) {
        contentRoot.innerHTML = `<div class="loading-spinner">No content available</div>`;
        return;
      }

      rows.forEach((row) => {
        const section = document.createElement('section');
        section.className = 'row';

        const header = document.createElement('div');
        header.className = 'row-header';

        const title = document.createElement('h2');
        title.className = 'row-title';
        title.textContent = row.title;

        const exploreBtn = document.createElement('button');
        exploreBtn.className = 'explore';
        exploreBtn.textContent = 'Explore All';
        const exploreGenre = GENRE_ROW_MAP[row.title] || (
          ['Drama', 'Action', 'Thriller', 'Horror'].includes(row.title) ? row.title : null
        );
        if (exploreGenre) {
          exploreBtn.addEventListener('click', () => activateGenre(exploreGenre));
        } else {
          exploreBtn.hidden = true;
        }

        header.appendChild(title);
        header.appendChild(exploreBtn);
        section.appendChild(header);

        const rowEl = document.createElement('div');
        rowEl.className = 'card-row';
        row.items.forEach((video) => rowEl.appendChild(createCard(video)));
        section.appendChild(rowEl);

        contentRoot.appendChild(section);
      });
    }

    function renderCurrentView() {
      const rows = getRowsFor(state.currentGenre);
      renderRows(rows);
    }

    // ============================================================
    // HERO
    // ============================================================
    function setHero(video) {
      if (!video) return;
      heroTitle.textContent = video.title;
      heroDate.textContent = video.date || '2026';
      heroDesc.textContent = video.desc || 'No description available.';
      const thumbnail = video.thumbnail || `https://i.ytimg.com/vi/${video.videoId || video.id}/hqdefault.jpg`;
      heroSection.style.backgroundImage = `linear-gradient(90deg, rgba(8,9,13,0.92) 0%, rgba(8,9,13,0.64) 30%, rgba(8,9,13,0.18) 60%, rgba(8,9,13,0.74) 100%), url("${encodeURI(thumbnail)}")`;
      watchNowBtn.onclick = () => playVideo(video);
      myListBtn.onclick = () => {
        const btn = myListBtn;
        const originalText = btn.textContent;
        btn.textContent = '✓ Added';
        setTimeout(() => btn.textContent = originalText, 1500);
      };
    }

    function activateGenre(genre) {
      state.currentGenre = genre;
      state.search = '';
      searchInput.value = '';
      navButtons.forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.genre === genre);
      });
      renderCurrentView();
      document.querySelector('.content-shell')?.scrollIntoView({ behavior: 'smooth' });
    }

    // ============================================================
    // EVENT LISTENERS
    // ============================================================
    closeModalBtn.addEventListener('click', closePlayer);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closePlayer();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('open')) {
        closePlayer();
      }
    });

    searchInput.addEventListener('input', (event) => {
      const query = event.target.value.trim().toLowerCase();
      state.search = query;
      if (!query) {
        renderCurrentView();
        return;
      }

      const filtered = state.videos.filter((video) =>
        (video.title || '').toLowerCase().includes(query) ||
        (video.genre || '').toLowerCase().includes(query)
      );

      renderRows([{ title: `Search Results (${filtered.length})`, items: filtered.slice(0, 12) }]);
    });

    navButtons.forEach((button) => {
      button.addEventListener('click', () => {
        navButtons.forEach((btn) => btn.classList.remove('active'));
        button.classList.add('active');
        state.currentGenre = button.dataset.genre;
        state.search = '';
        searchInput.value = '';
        renderCurrentView();
      });
    });

    // ============================================================
    // INIT
    // ============================================================
    setSyncStatus('Syncing B28 catalog…');
    loadCatalog();
    setInterval(loadCatalog, SOURCE_CONFIG.refreshMs);

    console.log('🎬 B28 Entertainment · Premium Streaming Experience');
    console.log(`📺 ${state.videos.length} videos loaded`);
  </script>
</body>
</html>
